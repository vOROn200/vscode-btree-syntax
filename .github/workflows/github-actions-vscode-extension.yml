name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check grammar JSON is generated from YAML
        run: npm run check:grammar

      - name: Package extension
        run: npx vsce package --out btree-syntax.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: btree-syntax.vsix

